<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece8e1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tavla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head><body>
<title>Tavla Masası</title>
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Düzen: ana ekranda iki oyun modu; oyun ekranında üstte tahta (Zar At ortada), altta Geri Al sayacı ve Sohbet/Geçmiş paneli. Renkler ceviz tahta ve çuha yeşili. */
:root{
  --bg:#ece8e1;--surface:#f8f5f0;--line:#d6cec1;--fg:#241b14;--muted:#6d6256;
  --accent:#1f6f5c;--accent-fg:#ffffff;--dis:#9b9285;--track:#e6dfd3;--thumb:#8a7e70;--cur:rgba(31,111,92,.09);
  --wood:#5a3a22;--field:#3a2616;--barc:#2a190d;--tri-a:#d6ad78;--tri-b:#9a4a32;
  --chk-l:#f4ecd8;--chk-ls:#a89878;--chk-li:#cdbf9f;--chk-d:#2c2420;--chk-ds:#000000;--chk-di:#5b4d44;
  --hi:#ffd54a;--hi-fill:rgba(255,213,74,.35);--dest:rgba(110,255,130,.42);--dest-s:#88ff88;
  --die:#fbfbf9;--die-pip:#10142b;--die-shadow:#b4b3ad;--die2:#b8372c;--die2-pip:#fff3e4;--die2-shadow:#4a0e08;
  color-scheme:light;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
button{font:inherit;font-weight:600;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer}
button:active{filter:brightness(.92)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;font-size:18px;letter-spacing:.2em;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;width:100%;min-width:0;-webkit-user-select:text;user-select:text}

/* ana ekran */
#home{display:flex;flex-direction:column;gap:18px;padding-top:6vh;overflow-y:auto;min-height:0}
#home h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,64px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
#home .lead{margin:0;color:var(--muted);max-width:38ch}
#strip{width:100%;height:36px;display:block}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;min-height:68px;font-weight:500}
.mode b{font-family:var(--display);font-size:20px;font-weight:700}
.mode span{color:var(--muted);font-size:14px}
.mode.primary span{color:var(--accent-fg);opacity:.85}
.mode:disabled{opacity:.5}
#home{gap:14px!important;padding-top:3vh!important}
.brand{margin-top:auto;padding:10px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.brand .bm{display:flex;align-items:center;gap:8px}
.brand svg{display:block}
.brand b{font-family:var(--display);font-size:17px;letter-spacing:.02em;color:var(--fg)}
.brand b em{font-style:normal;color:var(--accent)}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 12px;min-height:96px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);transition:all .2s}
.mc i{font-style:normal;font-size:24px;line-height:1}
.mc b{font-family:var(--display);font-size:17px;line-height:1.15}
.mc span{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.3}
.mc.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(31,111,92,.28)}
.mc.on span{color:#fff;opacity:.85}
.mc.off{opacity:.45;filter:grayscale(1)}
.sh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:2px 0 -6px}
.go{min-height:62px!important;border-radius:16px!important;background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;font-family:var(--display);font-size:22px!important;letter-spacing:.04em;box-shadow:0 8px 20px rgba(31,111,92,.32);flex:none}
.go:disabled{opacity:.6}
.jrow{display:flex;gap:8px}.jrow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
#lobbyMsg{min-height:0!important}
#lobby{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
#lobby .row{display:flex;gap:8px}
#lobby .row>*{flex:1;min-width:0}
#lobby h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
#lobbyMsg{min-height:20px;color:var(--accent);font-size:14px}
#dbNote{color:var(--muted);font-size:13px;margin:0}

/* oyun ekranı */
#play{display:flex;flex-direction:column;height:100%;min-height:0}
#top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0 4px}
#top .l,#top .r{display:flex;align-items:center;gap:6px}
#top button{padding:8px 11px}
#score{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;text-align:center;line-height:1.2;white-space:nowrap;min-width:0}
#scS{font-size:11px;font-weight:500;color:var(--muted);min-height:13px}
#scS.hot{color:#d94a38;font-weight:700}
#msg{min-height:34px;text-align:center;font-size:14px;padding:2px 4px 4px;color:var(--fg);display:flex;align-items:center;justify-content:center;line-height:1.3}
#boardWrap{flex:1;min-height:0}
#board{width:100%;height:100%;display:block}
#undoRow{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:4px 0}
#bSnd{min-width:40px;padding:0 8px;font-size:17px}
#pipc{flex:1;min-width:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boardWrap{position:relative}
#fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fe{position:absolute;font-size:44px;line-height:1;animation:rise 2s ease-out forwards;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-12px) scale(1.15)}100%{transform:translateY(var(--dy)) scale(1);opacity:0}}
#rx{display:flex;gap:0}
#rx button{min-height:34px;min-width:32px;padding:0 3px;border:0;background:transparent;font-size:19px}
.opts{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.og{display:flex;flex-direction:column;gap:5px}
.ol,#lobby h2.sub{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-width:0;padding:6px 4px;font-size:14px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cnt{height:30px;min-width:44px;padding:0 10px;border-radius:15px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cnt.off{background:var(--dis);color:#fff}

/* tahta */
.wood{fill:var(--wood)}.fld{fill:var(--field)}.barc{fill:var(--barc)}
.ta{fill:var(--tri-a)}.tb{fill:var(--tri-b)}
.cl{fill:var(--chk-l);stroke:var(--chk-ls);stroke-width:1.5}.cli{fill:none;stroke:var(--chk-li);stroke-width:1}
.cd{fill:var(--chk-d);stroke:var(--chk-ds);stroke-width:1.5}.cdi{fill:none;stroke:var(--chk-di);stroke-width:1}
.cll{fill:var(--chk-l);stroke:var(--chk-ls)}.cdl{fill:var(--chk-d);stroke:var(--chk-ds)}
.ring{fill:none;stroke:var(--hi);stroke-width:3;animation:pulse .9s infinite alternate}
.ring.sel{fill:var(--hi-fill)}
.dest{fill:var(--dest);stroke:var(--dest-s);stroke-width:1.5}
.lastp{fill:none;stroke:var(--hi);stroke-width:2.5}
.lastf{fill:none;stroke:var(--hi);stroke-width:2;stroke-dasharray:5 4;opacity:.8}
.rb{fill:var(--accent);stroke:#fff;stroke-width:2}
.rb.dis{fill:var(--dis)}
.rbs{fill:#000;opacity:.35}
.rt{fill:var(--accent-fg);font-family:var(--body);font-weight:700;text-anchor:middle}
.rb.dis+.rt{fill:#fff}
.dk{fill:var(--die2);stroke:#4a0e08}.dw{fill:var(--die);stroke:var(--die-shadow)}
.dp{fill:var(--die-pip)}.dpd{fill:var(--die2-pip)}
.zt{fill:#fff;fill-opacity:.95;font-family:var(--body);font-weight:700;text-anchor:middle;stroke:#000;stroke-opacity:.35;stroke-width:5;paint-order:stroke;pointer-events:none}
.zs{fill:#fff;fill-opacity:.78;font-family:var(--body);text-anchor:middle;stroke:#000;stroke-opacity:.35;stroke-width:3;paint-order:stroke;pointer-events:none}
.chipb{fill:var(--accent);stroke:#fff;stroke-opacity:.8}
.chipt{fill:var(--accent-fg);font-family:var(--body);font-weight:700;text-anchor:middle}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
#dbt{font-family:var(--display);font-weight:800;font-size:36px;text-anchor:middle;fill:#fff;stroke:#17382c;stroke-width:6;paint-order:stroke;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
#dbt.pop{animation:dblpop 1.6s ease-out forwards}
@keyframes dblpop{0%{opacity:0;transform:scale(.4) rotate(-9deg)}14%{opacity:1;transform:scale(1.28) rotate(-5deg)}26%{transform:scale(1) rotate(-4deg)}82%{opacity:1;transform:scale(1.05) rotate(-4deg)}100%{opacity:0;transform:scale(1.12) rotate(-4deg) translateY(-14px)}}
#tbg{filter:url(#tbblur)}
#msg{text-transform:uppercase;font-weight:600}
#play{position:relative}
#board{touch-action:none}
#msg{position:absolute!important;left:0;right:0;top:52px;margin:0 auto;width:fit-content;max-width:92%;z-index:6;pointer-events:none;background:rgba(36,27,20,.92)!important;color:#fff!important;border-radius:12px;padding:6px 12px!important;min-height:0!important;font-size:13px!important;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#msg:empty{display:none!important}
#undoRow{display:none!important}
#chat{position:relative}
#rxRec{display:none!important;gap:0}
@media (min-width:700px){#rxRec:not([hidden]){display:flex!important}}
#rxRec button{min-height:34px;min-width:34px;padding:0 3px;border:0;background:transparent;font-size:19px}
#bRes{white-space:nowrap}
.ovch{display:block;width:100%;margin-top:10px;text-align:center;line-height:1.35}
.ovch small{display:block;font-size:12px;font-weight:500;opacity:.85}
.ovch.red{border-color:#c0392b!important;color:#c0392b!important;background:var(--surface)!important}
#ctl{display:flex;gap:6px;align-items:center;margin-left:auto}
#ctl button{min-height:34px;padding:0 9px;font-size:12.5px;white-space:nowrap}
#bChip{white-space:nowrap}
#ctl #bSnd{min-width:38px;font-size:16px;padding:0 6px}
#rxBtn{min-height:34px;min-width:36px;padding:0 6px;font-size:18px;border:0;background:transparent}
#rx{position:absolute!important;right:8px;top:-46px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:2px 6px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:7}
#dbt.gold{fill:#ffd54a;stroke:#5a1a00;font-size:44px}
.ntg rect.b{fill:rgba(36,27,20,.9)}
.ntg text{fill:#fff;font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.02em}
.ntg.on rect.b{stroke:#ff9b2f;stroke-width:1.6}
.ntg.on rect.gl{fill:#ff9b2f;opacity:.55;filter:url(#tbblur)}
.ntg rect.gl{opacity:0}
.sira{fill:#ff9b2f;stroke:#5a1a00;stroke-width:3.2;paint-order:stroke;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.05em;text-anchor:middle}
.cmn{font-size:11px;color:var(--muted);margin:3px 4px -2px;font-weight:600;letter-spacing:.03em}
.cmn.r{align-self:flex-end}.cmn.l{align-self:flex-start}
#hello{display:flex;align-items:center;gap:8px;margin:-4px 0 6px;font-weight:600;font-size:16px}
#hello button{font-size:13px;padding:4px 10px;border-radius:999px}
#nmIn{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0 2px;text-transform:uppercase}
.emh{transform-box:fill-box;transform-origin:center;animation:emh 1s ease-in-out infinite}
.emt{animation:emt 1s ease-in-out infinite;pointer-events:none}
@keyframes emh{0%,100%{opacity:.35;transform:scale(.86)}50%{opacity:1;transform:scale(1.1)}}
@keyframes emt{0%,100%{opacity:.08}50%{opacity:.68}}
@media (prefers-reduced-motion:reduce){.emh,.emt{animation:none}.emt{opacity:.4}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.fe{animation-duration:.01s}}

/* alt panel: sohbet ve geçmiş */
#chat{height:212px;flex:none;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
@media (max-height:700px){#chat{height:176px}}
#chatHead{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 4px 6px;border-bottom:1px solid var(--line);gap:8px}
.tabs{display:flex;gap:2px}
.tab{position:relative;min-height:34px;padding:4px 14px;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.tab.on{background:var(--accent);color:var(--accent-fg)}
#bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#d94a38;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#chatHint{color:var(--muted);font-size:12px;white-space:nowrap}
.scr{flex:1;min-height:0;overflow-y:scroll;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
.scr::-webkit-scrollbar{width:8px}
.scr::-webkit-scrollbar-track{background:var(--track);border-radius:4px;margin:6px 0}
.scr::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:4px}
@supports not selector(::-webkit-scrollbar){.scr{scrollbar-width:thin;scrollbar-color:var(--thumb) var(--track)}}
#chatList{padding:8px 8px 8px 10px;display:flex;flex-direction:column;gap:5px}
.cm{max-width:80%;padding:5px 10px;border-radius:12px;font-size:14px;line-height:1.35;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line)}
.cm.me{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cm.them{align-self:flex-start}
#chatEmpty{margin:auto;color:var(--muted);font-size:14px;text-align:center}
#chatForm{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}
#chatForm input{font-size:16px;letter-spacing:normal;min-height:38px;flex:1}
#chatForm button{min-height:38px}
#histList{padding:0 8px 6px 12px}
.hh,.hr{display:grid;grid-template-columns:28px 1fr 1fr;align-items:center}
.hh{position:sticky;top:0;background:var(--surface);z-index:1;padding:8px 0 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.hr{height:38px;border-bottom:1px dashed var(--line)}
.hr.cur{background:var(--cur);border-radius:8px}
.hr .n{font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.hr .c{display:flex;align-items:center;gap:4px;min-width:0}
.hr .c svg{flex:none}
.hr .wait{color:var(--muted);font-size:13px}
.pill{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:0 6px;line-height:16px;margin-left:2px;white-space:nowrap}
.hempty{padding:14px 4px;color:var(--muted);font-size:14px}

#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#overlay .box{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%;line-height:1.5}
#overlay h2{margin:0 0 8px;font-family:var(--display);font-size:26px}
#overlay p{margin:6px 0}
#overlay .sc{font-variant-numeric:tabular-nums;color:var(--muted)}
#overlay button{margin-top:12px;width:100%}
</style>

<div id="app">
  <section id="home">
    <h1>Tavla Masası</h1>
    <div id="hello" hidden>Merhaba, <b id="helloN"></b><button id="bName">✎ Değiştir</button></div>
    <svg id="strip" viewBox="0 0 360 36" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="modes"><button class="mc on" id="mCpu"><i>🖥️</i><b>Bilgisayara karşı</b><span>Tek başına oyna</span></button><button class="mc off" id="mOnline"><i>👥</i><b>Arkadaşınla</b><span>Her biri kendi telefonundan</span></button></div>
    <div class="sh">Seçenekler</div>
    <div class="opts" id="optCpu">
      <div class="og"><span class="ol">Seviye</span><div class="seg" data-grp="lvl"><button data-v="easy">Kolay</button><button data-v="mid">Orta</button><button data-v="hard">Usta</button></div></div>
      <div class="og"><span class="ol">Set sayısı (kaç sayıya)</span><div class="seg" data-grp="tgt"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>
      <div class="og"><span class="ol">Hamle süresi</span><div class="seg" data-grp="tlc"><button data-v="0">Kapalı</button><button data-v="20">20 sn</button><button data-v="30">30 sn</button></div></div>
    </div>
    <div class="opts" id="optOn" hidden>
      <div class="og"><span class="ol">Set sayısı (kaç sayıya)</span><div class="seg" data-grp="tgt"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>
      <div class="og"><span class="ol">Hamle süresi</span><div class="seg" data-grp="tl"><button data-v="0">Kapalı</button><button data-v="20">20 sn</button><button data-v="30">30 sn</button></div></div>
      <div class="og"><span class="ol">Arkadaşın oda kurduysa</span><div class="jrow"><input id="codeIn" inputmode="numeric" maxlength="4" placeholder="Oda kodu (0000)" autocomplete="off"><button id="bJoin">Katıl</button></div></div>
      <button id="bResume" hidden></button>
      <div id="lobbyMsg"></div>
    </div>
    <button class="go" id="bGo">OYUNU BAŞLAT</button>
    <div class="brand"><div class="bm"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="5" width="18" height="18" rx="4.5" fill="#fbfbf9" stroke="#b4b3ad" transform="rotate(-10 10 14)"/><circle cx="6.8" cy="10.5" r="1.7" fill="#10142b"/><circle cx="12.6" cy="17.6" r="1.7" fill="#10142b"/><rect x="11" y="8" width="18" height="18" rx="4.5" fill="#1f6f5c" transform="rotate(8 20 17)"/><circle cx="15.6" cy="12.3" r="1.7" fill="#fff"/><circle cx="20" cy="17" r="1.7" fill="#fff"/><circle cx="24.4" cy="21.7" r="1.7" fill="#fff"/></svg><b><em>2B</em> Games</b></div><small>BİR 2B GAMES YAPIMIDIR · © 2026</small></div>
    <p id="dbNote" hidden></p>
  </section>

  <section id="play" lang="tr" hidden>

<script>
"use strict";
const $=s=>document.querySelector(s);
const K=s=>s===1?0:1;
const IDX=(s,p)=>s===1?p:23-p;
const sk=s=>s===1?'w':'k';
const r6=()=>1+Math.floor(Math.random()*6);
function removeOne(a,v){const i=a.indexOf(v);const r=a.slice();if(i>=0)r.splice(i,1);return r;}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- oyun mantığı ---------- */
// st.b[i] > 0: beyaz (taraf 1), < 0: siyah (taraf -1). Taraf 1, 23 -> 0 yönünde; taraf -1, 0 -> 23 yönünde ilerler.
// Her oyuncu tahtayı kendi tarafından görür: ekrandaki nokta numarası = o oyuncunun kendi koordinatı (ev: 0..5, sol alt; 24. nokta sol üst).
function newState(){
  const b=Array(24).fill(0);
  [[23,2],[12,5],[7,3],[5,5]].forEach(([p,c])=>{b[IDX(1,p)]+=c;b[IDX(-1,p)]-=c;});
  return {b,bar:[0,0],off:[0,0]};
}
const clone=st=>({b:st.b.slice(),bar:st.bar.slice(),off:st.off.slice()});
const stKey=st=>st.b.join(',')+'|'+st.bar.join(',')+'|'+st.off.join(',');
function allHome(st,s){
  if(st.bar[K(s)]>0)return false;
  for(let p=6;p<24;p++) if(st.b[IDX(s,p)]*s>0)return false;
  return true;
}
function singles(st,s,d){
  const out=[],k=K(s);
  const open=p=>st.b[IDX(s,p)]*s>=-1;
  if(st.bar[k]>0){const t=24-d;if(open(t))out.push({f:'bar',t,d});return out;}
  const home=allHome(st,s);
  let highest=-1;
  for(let p=23;p>=0;p--) if(st.b[IDX(s,p)]*s>0){highest=p;break;}
  for(let p=0;p<24;p++){
    if(st.b[IDX(s,p)]*s<=0)continue;
    const t=p-d;
    if(t>=0){if(open(t))out.push({f:p,t,d});}
    else if(home){if(t===-1||p===highest)out.push({f:p,t:'off',d});}
  }
  return out;
}
function apply(st,s,m){
  const n=clone(st),k=K(s);
  if(m.f==='bar')n.bar[k]--;else n.b[IDX(s,m.f)]-=s;
  if(m.t==='off')n.off[k]++;
  else{const i=IDX(s,m.t);if(n.b[i]*s===-1){n.b[i]=0;n.bar[1-k]++;}n.b[i]+=s;}
  return n;
}
let MEMO=new Map();
function maxPlay(st,s,dice){
  if(!dice.length)return 0;
  const key=s+'|'+stKey(st)+'#'+dice.slice().sort().join('');
  if(MEMO.has(key))return MEMO.get(key);
  let best=0;const seen=new Set();
  outer:for(const d of dice){
    if(seen.has(d))continue;seen.add(d);
    const rest=removeOne(dice,d);
    for(const m of singles(st,s,d)){
      const v=1+maxPlay(apply(st,s,m),s,rest);
      if(v>best)best=v;
      if(best===dice.length)break outer;
    }
  }
  MEMO.set(key,best);return best;
}
function legalMoves(st,s,dice){
  if(!dice.length)return [];
  if(MEMO.size>300000)MEMO=new Map();
  const M=maxPlay(st,s,dice);
  if(M===0)return [];
  let res=[];const seen=new Set();
  for(const d of dice){
    if(seen.has(d))continue;seen.add(d);
    const rest=removeOne(dice,d);
    for(const m of singles(st,s,d)){
      if(1+maxPlay(apply(st,s,m),s,rest)===M)res.push(m);
    }
  }
  if(M===1&&dice.length===2&&dice[0]!==dice[1]){
    const big=Math.max(...dice);
    if(res.some(m=>m.d===big))res=res.filter(m=>m.d===big);
  }
  return res;
}
// Kalan zarlarla ulaşılabilecek tek bir sonuç varsa o hamle dizisini döndürür; birden fazla sonuç varsa null (oyuncu seçer).
function uniquePlan(st,s,dice){
  const finals=new Map();let multi=false;const seen=new Set();
  (function rec(cur,rem,seq){
    if(multi)return;
    const ms=legalMoves(cur,s,rem);
    if(!ms.length){
      const k=stKey(cur);
      if(!finals.has(k))finals.set(k,seq);
      if(finals.size>1)multi=true;
      return;
    }
    for(const m of ms){
      if(multi)return;
      const n=apply(cur,s,m),r=removeOne(rem,m.d);
      const kk=stKey(n)+'#'+r.slice().sort().join('');
      if(seen.has(kk))continue;seen.add(kk);
      rec(n,r,seq.concat([m]));
    }
  })(st,dice,[]);
  if(multi)return null;
  return finals.size===1?finals.values().next().value:[];
}

/* ---------- yapay zeka ---------- */
function pips(st,s){
  let t=st.bar[K(s)]*25;
  for(let p=0;p<24;p++){const c=st.b[IDX(s,p)]*s;if(c>0)t+=c*(p+1);}
  return t;
}
// Pullar hâlâ birbirinin yanından geçecek mi? (geçmeyecekse yarış başlamıştır)
function contact(st){
  let mw=st.bar[0]>0?24:-1,mk=st.bar[1]>0?-1:24;
  for(let i=0;i<24;i++){const v=st.b[i];if(v>0&&i>mw)mw=i;else if(v<0&&i<mk)mk=i;}
  return mw>mk;
}
const W={off:4,bar:15,mp:1,prime:.9,stack:1.2,tempo:10,own:.25,hb:3,back:0,bl:0};
const SHOT=[0,11,12,14,15,15,17,6,6,5,3,2,3];
const MP=[1,1.5,2.5,3,3.5,4,3.5,3,2,1.5,1.5,1.5,2,1.5,1,1,1,1,2.5,3,3,2.5,1.5,1];
// x tarafının tek duran pullarının, sırası gelen rakip tarafından vurulma riski (kaybedilecek mesafe cinsinden)
function exposure(st,x){
  const h=-x,hit=[];
  for(let i=0;i<24;i++)if(st.b[i]*h>0)hit.push(i);
  const hbar=st.bar[K(h)]>0;
  let total=0;
  for(let p=0;p<24;p++){
    const i=IDX(x,p);
    if(st.b[i]*x!==1)continue;
    let miss=1;
    const add=d=>{if(d>=1&&d<=12)miss*=1-SHOT[d]/36;};
    if(hbar)add(h===1?24-i:i+1);
    else for(const j of hit)add(h===1?j-i:i-j);
    total+=(1-miss)*(24-p+W.tempo);
  }
  return total;
}
function homeMade(st,x){let n=0;for(let p=0;p<6;p++)if(st.b[IDX(x,p)]*x>=2)n++;return n;}
// x tarafının yapısal puanı: bar, kapılar (noktalar), ardışık kapı dizileri (prime), yığılma
function side(st,x){
  let sc=-st.bar[K(x)]*W.bar,run=0;
  for(let p=0;p<24;p++){
    const c=st.b[IDX(x,p)]*x;
    if(c>=2){sc+=MP[p]*W.mp;if(c>4)sc-=(c-4)*W.stack;run++;}
    else if(c===1&&p>=18)sc-=W.back;
    else{if(run>=2)sc+=run*(run-1)*W.prime;run=0;}
  }
  if(run>=2)sc+=run*(run-1)*W.prime;
  return sc;
}
// s tarafı açısından değer (yüksek = iyi). tm: sırası gelen taraf (varsayılan: rakip)
function evaluate(st,s,tm){
  const o=-s;if(tm===undefined)tm=o;
  let sc=pips(st,o)-pips(st,s)+(st.off[K(s)]-st.off[K(o)])*W.off;
  if(!contact(st))return sc;
  sc+=side(st,s)-side(st,o);
  sc+=st.bar[K(o)]*homeMade(st,s)*W.hb-st.bar[K(s)]*homeMade(st,o)*W.hb;
  sc-=exposure(st,s)*(tm===s?W.own:1);
  sc+=exposure(st,o)*(tm===o?W.own:1);
  return sc;
}
function finals(st,s,dice,cap){
  const out=[],seen=new Set();let n=0;
  (function rec(cur,rem,seq){
    if(cap&&n>=cap)return;
    const ms=legalMoves(cur,s,rem);
    if(!ms.length){n++;out.push({st:cur,seq});return;}
    for(const m of ms){
      const nx=apply(cur,s,m),r=removeOne(rem,m.d);
      const kk=stKey(nx)+'#'+r.slice().sort().join('');
      if(seen.has(kk))continue;seen.add(kk);
      rec(nx,r,seq.concat([m]));
    }
  })(st,dice,[]);
  return out;
}
const ROLLS=(()=>{const r=[];for(let a=1;a<=6;a++)for(let b=a;b<=6;b++)r.push({d:a===b?[a,a,a,a]:[a,b],w:a===b?1:2});return r;})();
function oppBest(st,o,dice){
  const fs=finals(st,o,dice,250);
  if(!fs.length)return evaluate(st,o,-o);
  let best=-1e9;
  for(const f of fs){const v=evaluate(f.st,o,-o);if(v>best)best=v;}
  return best;
}
// lv: 'easy' | 'mid' (tek adım) | 'hard' (rakibin 21 zarına verebileceği cevabı da hesaplar)
function chooseSeq(st,s,dice,lv){
  if(lv===true)lv='easy';
  if(lv==='hard'&&typeof NNET!=='undefined'&&NNET)return nnChoose(st,s,dice,1200);
  if(lv==='hard'&&typeof NNET!=='undefined'&&NNET)return nnChoose(st,s,dice,1200);
  const fs=finals(st,s,dice,0);
  if(!fs.length)return [];
  const seen=new Set(),cands=[];
  for(const f of fs){
    const k=stKey(f.st);if(seen.has(k))continue;seen.add(k);
    cands.push({seq:f.seq,st:f.st,sc:evaluate(f.st,s)+Math.random()*0.3});
  }
  cands.sort((a,b)=>b.sc-a.sc);
  if(lv==='easy'&&Math.random()<0.5)return cands[Math.floor(Math.random()*Math.min(cands.length,6))].seq;
  if(lv!=='hard'||cands.length===1)return cands[0].seq;
  const t0=performance.now(),N=Math.min(cands.length,12);
  let best=null;
  for(let i=0;i<N;i++){
    const c=cands[i];
    if(c.st.off[K(s)]===15)return c.seq;
    if(i>=2&&performance.now()-t0>1500)break;
    let ex=0;
    for(const r of ROLLS)ex-=r.w*oppBest(c.st,-s,r.d);
    c.v=ex/36;
    if(!best||c.v>best.v)best=c;
  }
  return best.seq;
}


/* ---------- Usta: kendi kendine oynayarak eğitilmiş sinir ağı + 2 adım arama + açılış kitabı ---------- */
const NNI=196;let NNET=null;
function nnLoad(o){const H=o.H;NNET={H,W1:Float32Array.from(o.W1),b1:Float32Array.from(o.b1),W2:Float32Array.from(o.W2),b2:Float32Array.from(o.b2),h:new Float32Array(H),x:new Float32Array(NNI)};}
function nnEval(st,s){ // s hamlesini yaptı, sıra rakipte: s açısından beklenen değer
  const N=NNET,x=N.x;x.fill(0);
  for(let side=0;side<2;side++){const q=side?-s:s,base=side*96;
    for(let p=0;p<24;p++){const c=st.b[IDX(q,p)]*q;if(c<=0)continue;const o=base+p*4;x[o]=1;if(c>=2)x[o+1]=1;if(c>=3)x[o+2]=1;if(c>3)x[o+3]=(c-3)/2;}}
  x[192]=st.bar[K(s)]/2;x[193]=st.bar[K(-s)]/2;x[194]=st.off[K(s)]/15;x[195]=st.off[K(-s)]/15;
  const {H,W1,b1,W2,b2,h}=N;
  for(let j=0;j<H;j++){let z=b1[j];const o=j*NNI;for(let i=0;i<NNI;i++){const v=x[i];if(v!==0)z+=W1[o+i]*v;}h[j]=1/(1+Math.exp(-z));}
  const y=[0,0,0];for(let k=0;k<3;k++){let z=b2[k];const o=k*H;for(let j=0;j<H;j++)z+=W2[o+j]*h[j];y[k]=1/(1+Math.exp(-z));}
  return 2*y[0]-1+y[1]-y[2];
}
function nnCands(st,s,dice){
  const fs=finals(st,s,dice,0),seen=new Set(),out=[];
  for(const f of fs){const k=stKey(f.st);if(seen.has(k))continue;seen.add(k);
    out.push({seq:f.seq,st:f.st,v:f.st.off[K(s)]===15?9:nnEval(f.st,s)});}
  out.sort((a,b)=>b.v-a.v);return out;
}
// açılış kitabı (konum = başlangıç dizilişi): [f,t] çiftleri, oyuncunun kendi numaralandırmasıyla (0 = 1. hane)
const BOOK={'3-1':[[7,4],[5,4]],'4-2':[[7,3],[5,3]],'5-3':[[7,2],[5,2]],'6-1':[[12,6],[7,6]],'6-4':[[7,1],[5,1]],'6-2':[[23,17],[12,10]],
  '6-3':[[23,17],[12,9]],'6-5':[[23,17],[17,12]],'5-1':[[12,7],[5,4]],'5-2':[[12,7],[12,10]],'5-4':[[23,19],[12,7]],'4-1':[[23,22],[12,8]],
  '4-3':[[23,19],[12,9]],'3-2':[[23,20],[12,10]],'2-1':[[12,10],[5,4]]};
function bookSeq(st,s,dice){
  if(dice.length!==2)return null;
  if(stKey(st)!==stKey(newState()))return null;
  const k=Math.max(...dice)+'-'+Math.min(...dice),bk=BOOK[k];if(!bk)return null;
  const want=bk.map(m=>m.join('>')).sort().join(',');
  for(const f of finals(st,s,dice,0)){if(f.seq.map(m=>m.f+'>'+m.t).sort().join(',')===want)return f.seq;}
  return null;
}
function nnChoose(st,s,dice,budget){
  const bk=bookSeq(st,s,dice);if(bk)return bk;
  const c=nnCands(st,s,dice);if(!c.length)return [];
  if(c.length===1||c[0].v===9)return c[0].seq;
  const t0=performance.now(),KN=Math.min(c.length,8);let best=null;
  for(let i=0;i<KN;i++){
    const q=c[i];if(i>=2&&performance.now()-t0>(budget||1200))break;
    let e=0;for(const r of ROLLS){const cc=nnCands(q.st,-s,r.d);const ov=cc.length?Math.min(9,cc[0].v):-nnEval(q.st,s);e-=r.w*ov;}
    q.e=e/36;if(!best||q.e>best.e)best=q;
  }

let AC=null,MASTER=null,NOISE=null;
function chain(){
  const ac=AC;

  comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.18;

  const rev=ac.createConvolver();

  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}

function decodeB64(ac,durl){const bin=atob(durl.split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Promise((res,rej)=>ac.decodeAudioData(u.buffer,res,rej));}

// k. kırık: 1 → tek ses (senin sesin), 2 → küçük grup, 3+ → kalabalık
function ohSound(k){
  try{if(MUTE)return;const ac=audio();if(!ac||ac.state!=='running')return;
    const go=b=>{
      if(MUTE)return;
      if(!b){const g=ac.createGain();g.gain.value=.55;g.connect(MASTER);crowdOh(ac,g,ac.currentTime+.05,k<=1?3:k===2?9:22,k*31+7);return;}
      const n=k<=1?1:k===2?6:14,t0=ac.currentTime+.04;let sd=(G.seed>>>0)%9973+k*131+1;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
      const bus=ac.createGain();bus.gain.value=n===1?1:1.25/Math.sqrt(n);bus.connect(MASTER);
      for(let i=0;i<n;i++){
        const s=ac.createBufferSource();s.buffer=b;
        s.playbackRate.value=i===0?1:0.78+rnd()*0.5;
        const g=ac.createGain();g.gain.value=i===0?1:.55+rnd()*.45;
        let node=g;if(ac.createStereoPanner&&n>1){const p=ac.createStereoPanner();p.pan.value=i===0?0:(rnd()-.5)*1.6;g.connect(p);node=p;}
        s.connect(g);node.connect(bus);s.start(t0+(i===0?0:rnd()*.3));
      }
    };
    if(ohBuf)go(ohBuf);else (loadOh(ac)||Promise.resolve(null)).then(go,()=>go(null));
  }catch(e){}
}

}
function pingSound(){
  try{
    if(MUTE)return;
    const ac=audio();if(!ac||ac.state!=='running')return;
    const t=ac.currentTime+0.02;
    [[0,660],[0.13,880]].forEach(([dt,f])=>{
      const o=ac.createOscillator();o.type='sine';o.frequency.value=f;
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t+dt);g.gain.exponentialRampToValueAtTime(0.22,t+dt+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.28);

    });
  }catch(e){}
}

    if(!(o[0]&&o[1])){render();if(cb)cb('next');return;}

    if(o[0]===o[1]){showBanner(0,'BERABERE!',true);flash(`İkiniz de ${o[0]} attınız, tekrar atılıyor.`,2600);}
    else{const st=o[0]>o[1]?1:-1;showBanner(0,nameOf(st)+' BAŞLIYOR!',true);flash(`Açılış zarı: sen ${mine}, ${oppName()} ${theirs}.`,3200);}
    later(()=>{if(tok!==opTok)return;opClear();G.opHold=0;render();if(cb)cb(o[0]===o[1]?'tie':(o[0]>o[1]?1:-1));},1600);
  },1050);
}
function opThrowLocal(side){
  const o=G.open.slice(),n=(G.openN||[0,0]).slice(),i=opIdx(side);o[i]=r6();n[i]=Math.max(n[0],n[1])+1;G.open=o;G.openN=n;G.busy=true;render();
  opSync(r=>{
    if(G.mode!=='local'||G.over)return;
    if(r==='next'){G.turn=-1;render();later(()=>{if(G.mode==='local'&&G.op)opThrowLocal(-1);},700);}
    else if(r==='tie'){G.open=[0,0];G.turn=1;G.busy=false;render();opPrompt();}
    else{G.op=0;G.open=o;G.turn=r;G.busy=false;render();proceed();}
  });
}
function opThrowOnline(){
  const i=opIdx(G.me),o=(G.open[0]&&G.open[1])?[0,0]:G.open.slice(),n=(G.openN||[0,0]).slice();
  o[i]=r6();n[i]=Math.max(n[0],n[1])+1;G.open=o;G.openN=n;
  if(!o[0]||!o[1]){G.turn=-G.me;pushFields({open:o,openN:n,turn:G.turn,op:1});}
  else if(o[0]===o[1]){G.turn=1;pushFields({open:o,openN:n,turn:1,op:1});}
  else{G.op=0;G.turn=o[0]>o[1]?1:-1;pushFields({open:o,openN:n,turn:G.turn,op:0,rolled:false,dice:[],all:[]});}
  render();opSync(r=>{if(r==='next'||r==='tie'){render();if(G.op)opPrompt();}else{render();notifyTurn();}});
}
function endTurn(){
  if(G.over)return;
  G.turn=-G.turn;G.rolled=false;G.dice=[];G.all=[];G.hist=[];G.sel=null;G.busy=false;G.endTimer=null;G.auto=false;
  proceed();
}
// kırık pulu olan taraf için 6 kapının hepsi kapalı mı?
function doorsClosed(st,s){if(!(st.bar[K(s)]>0))return false;for(let d=1;d<=6;d++)if(legalMoves(st,s,[d]).length)return false;return true;}
const nameOf=s=>s===G.me?myName():oppName();
function proceed(){
  if(G.over)return;
  if(!G.rolled&&doorsClosed(G.st,G.turn)){
    G.busy=true;flash(G.turn===G.me?'Kapılar kapalı, giremiyorsun. Sıra rakibe geçiyor.':`Kapılar kapalı, ${nameOf(G.turn)} giremiyor.`,2200);
    render();later(()=>{G.busy=false;endTurn();},1600);return;
  }
  if(G.turn===1){
    if(!G.rolled){G.msg=(G.note||'')+'Senin sıran. Tahtaya dokunup zarı at!';G.note='';render();return;}
    humanProceed();
  }else aiTurn();
}
function aiTurn(){
  G.busy=true;G.msg=(G.note||'')+'Bilgisayar düşünüyor…';G.note='';render();
  later(()=>{
    if(!G.rolled){
      const a=r6(),b=r6();G.all=a===b?[a,a,a,a]:[a,b];G.dice=G.all.slice();G.rolled=true;
      G.hl=logRoll(-1,[a,b]);
      G.rollPos={x:110+Math.random()*216,y:70+Math.random()*260};G.seed=(Math.random()*1e9)|0;G.flip=false;G.sw=null;
    }
    const seq=chooseSeq(G.st,-1,G.dice,LVL);G.last=[];
    G.msg=seq.length?'Bilgisayar oynuyor…':'Bilgisayarın oynayacak hamlesi yok.';
    render();
    let i=0;
    const step=()=>{
      if(i>=seq.length){later(endTurn,seq.length?700:1400);return;}
      const m=seq[i++];
      G.st=apply(G.st,-1,m);
      G.dice=removeOne(G.dice,m.d);
      pushLast(-1,m);
      render();
      if(G.st.off[1]===15){gameOver(-1);return;}
      later(step,650);
    };
    later(step,seq.length?Math.max(1100,animLeft()+200):Math.max(300,animLeft()+200));
  },900);
}

/* ---------- ortak oyun akışı ---------- */
function gameOver(s,pts0,why){
  G.over=true;G.busy=true;G.sel=null;G.endTimer=null;G.endTok++;G.autoTok++;G.auto=false;
  const loser=-s,mars=pts0?pts0>=2:G.st.off[K(loser)]===0,pts=pts0||(mars?2:1);
  G.result={winner:s,pts,mars,why:why||''};G.prevW=s;G.pw=s;
  let owner=false;
  if(G.mode==='local'){
    if(s===1)SC.you+=pts;else SC.cpu+=pts;
    lsSet('tavla_score',SC);owner=true;
  }else if(s===G.me||why){
    const sc=Object.assign({},G.score),wk=s===1?'w':'k';sc[wk]=(sc[wk]||0)+pts;G.score=sc;owner=true;
    pushFields({over:true,winner:s,pts,mars,score:sc,pw:s,why:why||'',offer:null});
  }
  G.shownGid=G.gid;
  render();later(()=>showResult(owner),900);
}
let resTok=0;
function showResult(owner){
  const r=G.result;if(!r)return;
  const local=G.mode==='local',won=r.winner===G.me;
  const sc=local?`${myName()} ${SC.you} – ${SC.cpu} BİLGİSAYAR`:`${myName()} ${G.score[myKey()]||0} – ${G.score[oppKey()]||0} ${oppName()}`;
  const mt=matchDone(local?'local':'online'),T=curTarget();
  const wn=r.winner===G.me?myName():oppName(),ln=r.winner===G.me?oppName():myName();
  const why=r.why==='resign'?`<p>${ln} çekildi: ${r.pts} sayı.</p>`:r.why==='offer'?`<p>${ln} 1 sayı vererek çekildi.</p>`:(r.mars?`<p>Mars: ${r.pts} sayı.</p>`:'');
  const title=mt?(won?'Maçı kazandın':`Maçı ${wn} kazandı`):(won?'Seti kazandın':`Seti ${wn} kazandı`);
  const tok=++resTok;
  if(mt){showOverlay(`<h2>${title}</h2><p>${T} sayılık maç bitti.</p>${why}<p class="sc">${sc}</p><button class="primary" id="ovOk">Yeni maç</button><button id="ovNo">Kapat</button>`,local?startLocal:startOnline);return;}
  showOverlay(`<h2>${title}</h2>${why}<p class="sc">${sc}</p><p class="sc">Sonraki set birazdan başlıyor…</p><button class="primary" id="ovOk">Devam</button>`,()=>{if(local)startLocal();else if(owner)startOnline();});
  later(()=>{if(resTok!==tok)return;if(!$('#overlay').hidden){$('#overlay').hidden=true;if(local)startLocal();else if(owner)startOnline();}},3400);
}
function scheduleEnd(ms){
  G.endTimer=true;G.endTok++;const tok=G.endTok;
  later(()=>{
    if(G.endTok!==tok||!G.endTimer||G.over)return;
    G.endTimer=null;
    if(G.mode==='online')endTurnOnline();else endTurn();
  },ms);
}
function doRoll(x,y,sw){
  if(G.over||G.busy||G.turn!==G.me||G.rolled||opHeld())return;
  if(G.mode==='online'&&!G.started)return;
  if(G.op){if(G.mode==='local')opThrowLocal(G.me);else opThrowOnline();return;}
  const a=r6(),b=r6();
  G.all=a===b?[a,a,a,a]:[a,b];G.dice=G.all.slice();G.rolled=true;G.hist=[];G.last=null;G.sel=null;
  G.hl=logRoll(G.me,[a,b]);
  G.rollPos={x:x==null?218:x,y:y==null?200:y};G.seed=(Math.random()*1e9)|0;G.flip=false;G.sw=sw||null;
  if(G.mode==='online')pushFields({dice:G.dice,all:G.all,rolled:true,last:null,hl:G.hl,rp:{x:G.rollPos.x,y:G.rollPos.y,s:G.me,sd:G.seed,sw:G.sw||null}});
  render();humanProceed();
}
function centerBtn(){
  if(!G.mode)return null;
  if(G.mode==='local'&&G.over)return null;
  if(G.mode==='online'){
    const both=G.seats.w&&G.seats.k;
    if(!G.loaded||!both)return {label:'Rakip bekleniyor',en:false};
    if(!G.started)return {label:'Oyunu Başlat',en:true};
    if(G.over)return {label:'Tekrar Oyna',en:true};
  }
  if(G.turn===G.me&&!G.rolled&&!G.busy&&!G.over&&!opHeld())return {label:'Zar At',en:true};
  return null;
}
function centerAction(){
  audio();
  const c=centerBtn();if(!c||!c.en)return;
  if(G.mode==='online'&&(!G.started||G.over)){startOnline();return;}
  doRoll();
}
function humanProceed(){
  if(G.over||G.busy||G.turn!==G.me||!G.rolled)return;
  if(G.mode==='online'&&(!G.started||G.endTimer))return;
  const plan=uniquePlan(G.st,G.me,G.dice);
  if(plan===null){
    if(G.mode==='local'){G.msg=(G.note||'')+hintText();G.note='';}
    render();return;
  }
  if(plan.length===0){
    G.busy=true;
    const t=G.dice.length&&G.dice.length<G.all.length?'Başka oynanabilir hamle yok, sıra geçiyor.':'Oynanabilir hamle yok, sıra geçiyor.';
    flash(t,1800);
    render();scheduleEnd(Math.max(1600,animLeft()+900));return;
  }
  autoPlay(plan);
}
function autoPlay(seq,why){
  G.busy=true;G.auto=true;G.sel=null;const tok=++G.autoTok;
  const txt=why||'Tek seçenek var, otomatik oynanıyor…';
  if(why)flash(txt,2200);
  render();
  let i=0;
  const step=()=>{
    if(G.autoTok!==tok||G.over)return;
    if(i>=seq.length){G.auto=false;afterHumanMove();return;}
    const m=seq[i++],me=G.me;
    G.st=apply(G.st,me,m);G.dice=removeOne(G.dice,m.d);
    pushLast(me,m);
    if(G.mode==='online')pushFields({b:G.st.b,bar:G.st.bar,off:G.st.off,dice:G.dice,last:G.last});
    render();
    if(G.st.off[K(me)]===15){gameOver(me);return;}
    later(step,600);
  };
  later(step,Math.max(900,animLeft()+150));
}
function afterHumanMove(){
  const me=G.me;
  if(G.st.off[K(me)]===15){gameOver(me);return;}
  G.busy=false;G.auto=false;
  if(!G.dice.length){
    G.busy=true;
    if(G.mode==='local')G.msg='Hamle bitti. Geri alabilirsin.';
    else flash('Hamle bitti, sıra rakibe geçiyor.',1500);
    render();scheduleEnd(1500);return;
  }
  humanProceed();
}
function onTap(kind,i){
  if(kind==='roll'){centerAction();return;}
  if(!G.mode||G.over||G.busy||G.turn!==G.me||!G.rolled||!G.dice.length)return;
  if(G.mode==='online'&&!G.started)return;
  const me=G.me;
  const ms=legalMoves(G.st,me,G.dice);
  if(!ms.length)return;
  const onBar=G.st.bar[K(me)]>0;
  if(onBar&&G.sel===null)G.sel='bar';
  const from=kind==='bar'?'bar':kind==='pt'?i:null;
  if(G.sel!==null){
    const target=kind==='off'?'off':kind==='pt'?i:null;
    if(target!==null){
      const cand=ms.filter(m=>m.f===G.sel&&m.t===target).sort((a,b)=>a.d-b.d);
      if(cand.length){doHuman(cand[0]);return;}
    }
  }
  if(from!==null&&ms.some(m=>m.f===from)){
    const c2=ms.filter(m=>m.f===from);
    if(new Set(c2.map(m=>m.t)).size===1){doHuman(c2.sort((a,b)=>a.d-b.d)[0]);return;}
    G.sel=(G.sel===from&&!onBar)?null:from;

  }

}
function doHuman(m){
  const me=G.me,online=G.mode==='online';
  G.hist.push({st:G.st,dice:G.dice.slice()});
  G.st=apply(G.st,me,m);
  G.dice=removeOne(G.dice,m.d);
  G.sel=null;
  pushLast(me,m);
  if(online)pushFields({b:G.st.b,bar:G.st.bar,off:G.st.off,dice:G.dice,last:G.last});
  render();
  afterHumanMove();
}
function canUndo(){
  return !!(G.mode&&!G.over&&G.turn===G.me&&G.hist.length&&(!G.busy||G.endTimer)&&(G.un[myKey()]||0)>0);
}
function undo(){
  if(!canUndo())return;
  const k=myKey(),online=G.mode==='online';
  G.endTimer=null;G.endTok++;G.autoTok++;G.auto=false;G.busy=false;
  const h=G.hist.pop();G.st=h.st;G.dice=h.dice;G.sel=null;G.last=(Array.isArray(G.last)&&G.last.length>1)?G.last.slice(0,-1):null;
  G.un=Object.assign({},G.un);G.un[k]=Math.max(0,(G.un[k]||0)-1);
  if(online){pushFields({b:G.st.b,bar:G.st.bar,off:G.st.off,dice:G.dice,last:G.last,un:G.un});}
  else G.msg='Hamle geri alındı.';
  render();
}

/* ---------- online oda ---------- */
function pushFields(f){
  if(!ROOM)return;
  G.rev++;f.rev=G.rev;
  pending=Object.assign(pending||{},f);
  flush();
}
async function flush(){
  if(writing)return;
  writing=true;
  const ref=ROOM;
  try{
    while(pending&&ref){const p=pending;pending=null;await ref.update(p);}
  }catch(e){
    pending=null;
    flash('Kaydedilemedi. İnternet bağlantını kontrol et.',6000);
  }
  writing=false;
  if(lateSnap){const s=lateSnap;lateSnap=null;onRoom(s);}
}
function applyRoom(d){
  G.st={b:d.b.slice(),bar:d.bar.slice(),off:d.off.slice()};
  G.turn=d.turn;G.dice=(d.dice||[]).slice();G.all=(d.all||[]).slice();G.rolled=!!d.rolled;
  G.over=!!d.over;G.started=!!d.started;G.seats=Object.assign({w:null,k:null},d.seats);
  G.last=Array.isArray(d.last)?d.last:(d.last&&typeof d.last.to!=='undefined'?[{f:null,t:d.last.to,by:d.last.by}]:null);G.score=Object.assign({w:0,k:0},d.score);
  G.target=d.target||0;G.tl=d.tl||0;
  G.result=d.over?{winner:d.winner,pts:d.pts,mars:d.mars,why:d.why||''}:null;
  G.op=d.op||0;G.pw=d.pw||0;G.offer=d.offer||null;G.offN=Object.assign({w:3,k:3},d.offN);
  G.nm=Object.assign({w:'',k:''},d.nm);G.open=d.open||[0,0];G.openN=d.openN||[0,0];G.hl=Array.isArray(d.hl)?d.hl:[];G.un=Object.assign({w:3,k:3},d.un);
  G.sw=(d.rp&&d.rp.sw&&typeof d.rp.sw.sx==='number')?d.rp.sw:null;G.rollPos=(d.rp&&typeof d.rp.x==='number')?(d.rp.s===G.me?{x:d.rp.x,y:d.rp.y}:{x:d.rp.x,y:400-d.rp.y}):{x:218,y:200};
  G.flip=!!(d.rp&&d.rp.s!==undefined&&d.rp.s!==G.me);G.seed=(d.rp&&d.rp.sd)|0||1;
}
function openingNote(){
  const a=G.open[0],b=G.open[1];
  const mine=G.me===1?a:b,theirs=G.me===1?b:a;
  return `Açılış zarı: sen ${mine}, ${oppName()} ${theirs}. `+(G.turn===G.me?'Sen başlıyorsun.':`${oppName()} başlıyor.`);
}
function onRoom(snap){
  if(G.mode!=='online'||!snap.exists)return;
  if(pending||writing){lateSnap=snap;return;}
  const d=snap.data();
  if(G.loaded&&(d.rev||0)<=G.rev)return;
  G.loaded=true;G.rev=d.rev||0;
  applyRoom(d);
  const gid=d.gid||0;
  G.hist=[];G.sel=null;if(!G.endTimer&&!G.auto&&!G.opAnim)G.busy=false;
  const fresh=gid!==G.gid;
  G.gid=gid;
  if(fresh&&d.started&&!d.over&&!d.rolled&&!(d.last&&d.last.length))setIntro();
  else if(d.started&&!d.over){const o=G.open||[0,0],sh=G.opShown||[0,0];
    const n=G.openN||[0,0];if(n[0]!==sh[0]||n[1]!==sh[1]||(!o[0]&&!o[1]&&Object.keys(OPD).length)){opSync(r=>{render();if(r==='next'||r==='tie'){if(G.op)opPrompt();}else notifyTurn();});}}
  render();notifyTurn();onlineProceed();maybeSkip();
  offerCheck();
  if(G.over&&G.shownGid!==G.gid){G.shownGid=G.gid;later(()=>showResult(false),900);}
}
let skipKey='';
function maybeSkip(){
  if(G.mode!=='online'||!G.started||G.over||G.rolled)return;
  if(!doorsClosed(G.st,G.turn))return;
  const key=G.gid+':'+G.rev+':'+G.turn;if(skipKey===key)return;skipKey=key;
  if(G.turn===G.me){
    G.busy=true;flash('Kapılar kapalı, giremiyorsun. Sıra rakibe geçiyor.',2200);render();
    later(()=>{if(G.turn!==G.me||G.rolled||G.over)return;G.busy=false;endTurnOnline();},1600);
  }else flash(`Kapılar kapalı, ${oppName()} giremiyor.`,2200);
}
function onlineProceed(){
  if(G.mode!=='online'||!G.started||G.over)return;
  if(G.turn!==G.me||!G.rolled||G.endTimer||G.busy)return;
  humanProceed();
}
function endTurnOnline(){
  if(G.over||G.mode!=='online')return;
  G.turn=-G.turn;G.rolled=false;G.dice=[];G.all=[];G.hist=[];G.sel=null;G.busy=false;G.endTimer=null;G.auto=false;
  pushFields({turn:G.turn,rolled:false,dice:[],all:[]});
  render();maybeSkip();
}
function startOnline(){
  if(G.mode!=='online'||!(G.seats.w&&G.seats.k))return;
  if(G.started&&!G.over)return;
  const md=matchDone('online'),keep=md?{w:0,k:0}:G.score;

  pushFields({b:st.b,bar:st.bar,off:st.off,turn:starter,dice:[],all:[],rolled:false,started:true,over:false,winner:0,last:null,score:keep,gid,open:[a,b],openN:[0,0],op,hl:[],un:G.un,offN:G.offN,offer:null,why:'',rp:{x:218,y:200,s:starter,sd:G.seed,sw:null}});
  render();setIntro();

function setIntro(){

  else{flash(`Önceki seti ${G.turn===G.me?myName():oppName()} kazandı.`,3000);showBanner(150,'KAZANAN BAŞLAR!',true);}
}
function enterRoom(code,ref,me){

    last:null,result:null,seats:{w:null,k:null},started:false,score:{w:0,k:0},gid:0,rev:-1,loaded:false,endTimer:null,shownGid:-1,hl:[],un:{w:3,k:3},poseKey:'',rollPos:{x:218,y:200},target:0,tl:0,deadline:0});

function leaveRoom(){

  chatReset();
}
function lobbyMsg(t){$('#lobbyMsg').textContent=t||'';}
async function createRoom(){
  if(!DB)return;
  lobbyMsg('Oda kuruluyor…');
  try{
    for(let t=0;t<6;t++){
      const code=String(1000+Math.floor(Math.random()*9000));
      const ref=DB.doc('games/'+code);
      const snap=await ref.get();
      if(snap.exists)continue;
      const st=newState();
      await ref.set({b:st.b,bar:st.bar,off:st.off,turn:1,dice:[],all:[],rolled:false,over:false,winner:0,pts:0,mars:false,started:false,last:null,gid:0,rev:0,open:[0,0],hl:[],un:{w:3,k:3},score:{w:0,k:0},target:TARGET,tl:TLIM,seats:{w:TOKEN,k:null},nm:{w:NAME||''}});
      lobbyMsg('');enterRoom(code,ref,1);return;
    }
    lobbyMsg('Oda kurulamadı, tekrar dene.');
  }catch(e){lobbyMsg('Oda kurulamadı. İnternet bağlantını kontrol et.');}
}
async function joinRoom(code){
  if(!DB)return;
  if(!/^\d{4}$/.test(code)){lobbyMsg('Kod 4 haneli olmalı.');return;}
  lobbyMsg('Odaya giriliyor…');
  try{
    const ref=DB.doc('games/'+code);
    const snap=await ref.get();

/* ---------- zar çizimi ve efekti ---------- */
const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const DS={y0:18,y1:382,r:10,rc:12.5,dt:1/120,k:2.7,c:120,rest:.55,zg:900,zrest:.42,hl:[46,188],hr:[248,392]};
// Hızı v, ilk dikey hızı vz0, yüksekliği z0 olan zarın (duvarsız) durana kadar aldığı yol
function dryDist(v,z0,vz0,kf){
  const{dt,zg,zrest}=DS,k=DS.k*kf,c=DS.c*kf;let x=0,vx=v,z=z0,vz=vz0,n=0;
  while(n++<2400){

    if(z===0&&vz===0){vx=Math.max(0,vx*Math.exp(-k*dt)-c*dt);}else vx*=Math.exp(-.2*dt);

function solveV(D,z0,vz0,kf){let lo=20,hi=3200;for(let i=0;i<32;i++){const m=(lo+hi)/2;if(dryDist(m,z0,vz0,kf)<D)lo=m;else hi=m;}return (lo+hi)/2;}
// (tx,ty): atanın dokunduğu nokta; obs: pulların merkezleri [[x,y],...] (atanın kendi görünümünde)
// Zarlar ortadaki çubuğun yanından, atanın kenarından çıkıp dokunulan yarıya yuvarlanır; çubuğu geçmez.
function simDice(tx,ty,seed,obs,sw){
  const rnd=mulberry(seed|0),{y0,y1,r,rc,dt,k,c}=DS;
  const left=(sw?sw.sx:tx)<218,[xa,xb]=left?DS.hl:DS.hr;
  const rr=r+rc;
  const bx=left?DS.hl[1]-4:DS.hr[0]+4;                       // çubuğun yanı (orta eksen)
  const sy=Math.max(130,Math.min(330,220+(ty-220)*.4));
  const d=[];
  if(sw){ // parmakla kaydırma: zarlar parmağın kalktığı yerden, kaydırma yönünde ve hızıyla çıkar
    const ul=Math.hypot(sw.ux,sw.uy)||1,ux=sw.ux/ul,uy=sw.uy/ul,nx=-uy,ny=ux;
    const cx0=Math.max(xa+8,Math.min(xb-8,sw.sx)),cy0=Math.max(y0+12,Math.min(y1-12,sw.sy));
    for(let i=0;i<2;i++){
      const o=(i?1:-1)*(10+rnd()*3);
      const px=Math.max(xa+4,Math.min(xb-4,cx0+nx*o-ux*(i?6:0))),py=Math.max(y0+6,Math.min(y1-6,cy0+ny*o-uy*(i?6:0)));
      const ang=Math.atan2(uy,ux)+(rnd()-.5)*.22,v=sw.v*(.9+rnd()*.2);
      const z0=40+rnd()*26,vz0=60+rnd()*60,kf=.6+rnd()*.9;
      d.push({x:px,y:py,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,th:rnd()*6.28,w:(rnd()<.5?-1:1)*(5+rnd()*9),kf,z:z0,vz:vz0,trav:0,rest:false});
    }
  }
  for(let i=0;i<2&&!sw;i++){
    const px=bx+(left?-1:1)*(i?10:0)+(rnd()-.5)*4,py=sy+(i?19:-19)+(rnd()-.5)*8;
    const gx=tx+(i?(left?-14:14):(left?14:-14))+(rnd()-.5)*18,gy=ty+(i?-14:14)+(rnd()-.5)*20;
    const over=rnd()<.6?35+rnd()*130:(rnd()-.5)*24;
    const D=Math.hypot(gx-px,gy-py)+over;
    const z0=70+rnd()*26,vz0=rnd()*50,kf=.6+rnd()*.9;
    const v=solveV(Math.max(80,D),z0,vz0,kf)*(.97+rnd()*.06);
    const ang=Math.atan2(gy-py,gx-px)+(rnd()-.5)*.2;

  }

  while(n<480){
    for(let i=0;i<2;i++){
      const p=d[i];if(p.rest)continue;
      p.vz-=DS.zg*dt;p.z+=p.vz*dt;
      if(p.z<=0){p.z=0;if(p.vz<-60){hit('tbl',-p.vz/420,i);p.vz=-p.vz*DS.zrest;}else p.vz=0;}
      const sp=Math.hypot(p.vx,p.vy);
      if(p.z===0&&p.vz===0){
        const ns=Math.max(0,sp*Math.exp(-k*p.kf*dt)-c*p.kf*dt);
        if(sp>0){p.vx*=ns/sp;p.vy*=ns/sp;}
      }else{p.vx*=Math.exp(-.2*dt);p.vy*=Math.exp(-.2*dt);}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.th+=p.w*dt;p.w*=Math.exp(-(p.z>0?.3:1.3)*dt);
      const s2=Math.hypot(p.vx,p.vy);p.trav+=s2*dt;
      const onT=p.y<y1+8;
      if(onT&&p.x<xa&&p.vx<0){p.x=xa;hit('wall',s2/500,i);p.vx=-p.vx*DS.rest;p.w+=p.vy*.012;}
      if(onT&&p.x>xb&&p.vx>0){p.x=xb;hit('wall',s2/500,i);p.vx=-p.vx*DS.rest;p.w-=p.vy*.012;}
      if(p.y<y0&&p.vy<0){p.y=y0;hit('wall',s2/500,i);p.vy=-p.vy*DS.rest;p.w+=p.vx*.012;}
      if(p.y>y1&&p.vy>0&&p.y<y1+20){p.y=y1;hit('wall',s2/500,i);p.vy=-p.vy*DS.rest;p.w-=p.vx*.012;}

      if(p.z<14){

          const ox=p.x-O[q][0],oy=p.y-O[q][1];
          if(Math.abs(ox)>rr||Math.abs(oy)>rr)continue;
          const dd=Math.hypot(ox,oy);
          if(dd>=rr||dd===0)continue;
          const nx=ox/dd,ny=oy/dd,vn=p.vx*nx+p.vy*ny;
          if(vn<0){
            const tx2=-ny,ty2=nx,vt=p.vx*tx2+p.vy*ty2;

      if(s2<5&&p.z===0&&p.vz===0&&p.y<y1+8){p.rest=true;p.vx=p.vy=0;p.settled=t;}
    }
    const a=d[0],b=d[1],ddx=b.x-a.x,ddy=b.y-a.y,dd=Math.hypot(ddx,ddy);
    if(dd<2*r&&dd>0&&a.z<r*1.4&&b.z<r*1.4){
      const nx=ddx/dd,ny=ddy/dd,rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;

      }

    }

    t+=dt;n++;
    if(d[0].rest&&d[1].rest)break;
  }
  return {fr,ev,dur:t,settled:d.map(p=>p.settled===undefined?t:p.settled),rest:d.map(p=>[p.x,p.y])};
}
// dokunulan noktaya en yakın, pulların üstünde durmayan atışı seç (iki tarafta aynı sonuç)
function throwFor(tx,ty,seed,obs,sw){
  const left=tx<218;
  tx=left?Math.max(66,Math.min(176,tx)):Math.max(260,Math.min(372,tx));
  let best=null;
  for(let q=0;q<60;q++){
    const o=simDice(tx,ty,seed+q,obs,sw);
    const a=o.rest[0],b=o.rest[1];
    const d=sw?0:Math.hypot((a[0]+b[0])/2-tx,(a[1]+b[1])/2-ty),sep=Math.hypot(a[0]-b[0],a[1]-b[1]);
    let bad=(sep<22?200:0)+(sep>95?40:0)+((a[1]>DS.y1+4||b[1]>DS.y1+4)?500:0);
    for(const c of (obs||[])){
      if(Math.hypot(a[0]-c[0],a[1]-c[1])<DS.r+DS.rc+2||Math.hypot(b[0]-c[0],b[1]-c[1])<DS.r+DS.rc+2){bad+=200;break;}
    }
    const sc=d+bad;
    if(!best||sc<best.sc)best={o,sc};
    if(sc<45)break;
  }
  return best.o;
}

  for(const q of faces){

    s+=`<clipPath id="${id}"><polygon points="${pts}"/></clipPath><g clip-path="url(#${id})" opacity="${(.25+.75*q.lam).toFixed(2)}"><g transform="matrix(${m})"><circle r="1.5" fill="url(#dhl)"/></g></g>`;
    const one=q.f.v===1;

    while(ei<evs.length&&evs[ei].t<=t+1e-9){const e=evs[ei++];const m=(e.k==='tbl'?9:6)+16*Math.min(1,e.v);
      w=[w[0]+(rnd()-.5)*m,w[1]+(rnd()-.5)*m,w[2]+(rnd()-.5)*m*.5];}
    if(settle){
      const u=Math.min(1,(t-settle.t0)/settle.d),e=1-Math.pow(1-u,3);
      R=mm(axisRot(settle.ax,settle.ang*e),settle.R0);

      if(z<=0.5){ // masada: yuvarlanma bağı (kaymadan yuvarlanmaya doğru)
        const wr=[-vy/rr,vx/rr,w[2]*.85];
        const c=Math.min(1,10*dt);w=[w[0]+(wr[0]-w[0])*c,w[1]+(wr[1]-w[1])*c,w[2]+(wr[2]-w[2])*c];
      }else{w=w.map(v=>v*Math.exp(-.25*dt));}
      {const m=Math.hypot(...w),e=env(t);if(m>e)w=w.map(v=>v*e/m);}
      const wm=Math.hypot(...w);
      if(wm>1e-6)R=orthon(mm(axisRot(w,wm*dt),R));
      const left=(S.settled[i]-t);
      if(z<=0.5&&(spd<34||left<.2)&&t>.25){ // yavaşladı: en yakın düz yüzeye devril
        let best=null;for(const fc of FACES){const n=mv(R,fc.n);if(!best||n[2]>best.n[2])best={n,fc};}
        const n=best.n,ax=[n[1],-n[0],0],ang=Math.acos(Math.max(-1,Math.min(1,n[2])));
        settle={t0:t,d:Math.max(.08,Math.min(.2,left)),ax:Math.hypot(ax[0],ax[1])>1e-6?ax:[1,0,0],ang,R0:R};
      }
    }

  }
  if(settle)out[N-1]=mm(axisRot(settle.ax,settle.ang),settle.R0);

}

function faceMap(Rf,v,rnd){
  const f=[Rf[6],Rf[7],Rf[8]]; // Rf^T z = Rf'nin 3. satırı
  const nv=FACES.find(x=>x.v===v).n;
  const opts=CUBE24.filter(Q=>{const q=mv(Q,nv);return Math.abs(q[0]-Math.round(f[0]))<.5&&Math.abs(q[1]-Math.round(f[1]))<.5&&Math.abs(q[2]-Math.round(f[2]))<.5;});
  const Q=opts.length?opts[Math.floor(rnd()*opts.length)]:ID3;
  const R=mm(Rf,Q),top=FACES.find(x=>x.v===v),u=mv(R,top.u);
  const a=Math.atan2(u[1],u[0]),snap=Math.round(a/(Math.PI/2))*(Math.PI/2);
  return {Q,yawFix:snap-a};
}

      for(let j=0;j<c;j++){const cy=top?8+13.5+j*step:392-13.5-j*step;const d=emD();emDel.push(d);h+=`<circle class="emh" style="${d}" cx="${x+14}" cy="${cy}" r="21" fill="url(#emH)"/>`;}
    }
  }
  let emK=0;
  mvFeed();
  const hideN=k=>MV.hide[k]||0;
  for(let p=0;p<24;p++){
    const v=st.b[IDX(me,p)]*me;if(!v)continue;
    const c=Math.abs(v),light=v>0,x=PX(p),top=PTOP(p);
    const step=c<=6?25:125/(c-1);
    const hid=hideN('p'+IDX(me,p));
    for(let j=0;j<c;j++){
      if(j>=c-hid)continue;
      const cy=top?8+13.5+j*step:392-13.5-j*step;
      h+=checker(x+14,cy,light);
      if(light?burnMe:burnOp)h+=tint(x+14,cy,emDel[emK++]||'');
      if(j===c-1&&light&&(srcs.has(p)||sel===p))h+=`<circle class="ring${sel===p?' sel':''}" cx="${x+14}" cy="${cy}" r="14.5"/>`;
    }
  }
  const mb=st.bar[K(me)],ob=st.bar[K(-me)];
  const bs=BS;
  for(let j=0;j<mb;j++){
    const cy=173-j*bs(mb);
    if(burnMe)h+=halo(218,cy);
    h+=checker(218,cy,true);
    if(burnMe)h+=tint(218,cy,'');
    if(j===mb-1&&(srcs.has('bar')||sel==='bar'))h+=`<circle class="ring" cx="218" cy="${cy}" r="14.5"/>`;
  }
  for(let j=0;j<ob;j++){const cy=227+j*bs(ob);if(burnOp)h+=halo(218,cy);h+=checker(218,cy,false);if(burnOp)h+=tint(218,cy,'');}
  for(let j=0;j<st.off[K(me)]-hideN('o'+me);j++)h+=`<rect x="8" y="${390-(j+1)*8.5}" width="22" height="7" rx="2" fill="url(#gI)" stroke="#a89878"/>`;
  for(let j=0;j<st.off[K(-me)]-hideN('o'+(-me));j++)h+=`<rect x="8" y="${10+j*8.5}" width="22" height="7" rx="2" fill="url(#gB)" stroke="#1c0706"/>`;
  for(let p=0;p<24;p++){
    const x=PX(p),top=PTOP(p);
    h+=`<rect data-k="pt" data-i="${p}" x="${x}" y="${top?6:204}" width="28" height="190" fill="transparent"/>`;
  }
  h+=`<rect data-k="bar" x="204" y="6" width="28" height="388" fill="transparent"/>`;
  h+=`<rect data-k="off" x="6" y="200" width="26" height="194" fill="transparent"/>`;
  if(cb&&cb.label==='Zar At'){
    h+=`<text class="zt" x="218" y="204" font-size="30">ZAR AT</text><text class="zs" x="218" y="229" font-size="13">tahtanın herhangi bir yerine dokun</text>`;
  }else if(cb){

    h+=`<rect class="rbs" x="${x0}" y="204" width="${w}" height="50" rx="25"/>`;
    h+=`<rect class="rb${cb.en?'':' dis'}" x="${x0}" y="175" width="${w}" height="50" rx="25"/>`;
    h+=`<text class="rt" x="218" y="206" font-size="${cb.label.length>12?16:19}">${cb.label}</text>`;
    if(cb.en)h+=`<rect data-k="roll" x="${x0}" y="175" width="${w}" height="50" rx="25" fill="transparent" style="cursor:pointer"/>`;
  }
  $('#bg').innerHTML=h;

  const key=G.turn+':'+G.all.join(',');
  if(G.all.length&&G.poseKey!==key){
    G.poseKey=key;
    const tap=G.flip?{x:G.rollPos.x,y:400-G.rollPos.y}:G.rollPos;
    G.sim=throwFor(tap.x,tap.y,G.seed||1,checkerObs(G.st,G.flip?-G.me:G.me),G.sw||null);G.pose=G.sim;
    G.spin=null;
    G.trk=[0,1].map(i=>{const rnd=mulberry((G.seed||1)+i*977+11);
      const T=spinTrack(G.sim,i,rnd,G.flip,10.5);const fm=faceMap(T.Rf,G.all[i],rnd);return {fr:T.fr,Q:fm.Q,yawFix:fm.yawFix};});
    { // kırık pul giremedi mi?
      if(!G.binF)G.binF=[0,0];
      const s=G.turn,k=K(s);
      if(G.st.bar[k]>0&&legalMoves(G.st,s,G.all).length===0)G.binF[k]++;else G.binF[k]=0;
      if(G.binF[k]>=2){showBanner(Math.round(G.sim.dur*1000*.8),BINF[((G.seed>>>0)+G.binF[k])%BINF.length],false);if([2,4,6].includes(G.binF[k]))binfSound(Math.round(G.sim.dur*1000*.8));}
      else if(G.all.length===4)showDbl(Math.round(G.sim.dur*1000*.8));
    }
    G.anim={t0:performance.now(),dur:RM?1:Math.round(G.sim.dur*1000)+HOLD+GLIDE};
    rollSound(G.sim);startAnim();
  }else if(!G.all.length)G.poseKey='';
  drawDice(performance.now());

  $('#msg').textContent=G.flash||'';
  if(online){
    $('#scT').textContent=`${myName()} ${G.score[myKey()]||0} – ${G.score[oppKey()]||0} ${oppName()}`;

  }else{

    $('#bChip').textContent=LVLN[LVL];
    $('#bChip').title='Seviyeyi değiştir';
    $('#bNew').hidden=false;
  }
  tagsPaint();
  timerSync();updateSub();
  $('#pipc').textContent=`Kalan: Sen ${pips(st,me)} · Rakip ${pips(st,-me)}`;
  $('#bSnd').textContent=MUTE?'🔇':'🔊';
  const left=Math.max(0,(G.un[myKey()]||0));

  $('#undoCnt').classList.toggle('off',left===0);
  $('#bUndo').disabled=!canUndo();
  histPaint(false);
}

  const show=active&&(mine||G.mode==='online');

/* Firebase Realtime Database (REST + SSE), SDK'sız. Claude db arayüzüyle aynı: doc(path).get/set/update/onSnapshot, collection(name).add/orderBy/limit/onSnapshot */
function makeRTDB(base){
  base=base.replace(/\/+$/,'');
  const enc=s=>s.split('/').map(encodeURIComponent).join('/');
  const clone=x=>x===undefined?x:JSON.parse(JSON.stringify(x));
  async function req(method,path,body,q){
    const r=await fetch(base+'/'+enc(path)+'.json'+(q||''),{method,headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }
  // düz ağaç: iç içe nesneleri "a/b" yoluna açar (RTDB update üst anahtarı komple değiştirdiği için)
  function flat(o,pre,out){
    for(const k of Object.keys(o)){
      const v=o[k],p=pre?pre+'/'+k:k;
      if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flat(v,p,out);else out[p]=v===undefined?null:v;
    }
    return out;
  }
  function putAt(tree,path,val){
    const seg=path.split('/').filter(Boolean);
    if(!seg.length)return val===undefined?null:val;
    let root=(tree&&typeof tree==='object')?tree:{};
    let cur=root;
    for(let i=0;i<seg.length-1;i++){
      const k=seg[i];
      if(!cur[k]||typeof cur[k]!=='object')cur[k]={};
      cur=cur[k];
    }
    const last=seg[seg.length-1];
    if(val===null||val===undefined)delete cur[last];else cur[last]=val;
    return root;
  }
  function patchAt(tree,path,data){
    for(const k of Object.keys(data||{}))tree=putAt(tree,(path?path+'/':'')+k,data[k]);
    return tree;
  }
  // SSE akışı: önbelleği tutar, her değişimde cb(ağaç)
  function stream(path,q,cb,onErr){
    let tree=null,es=null,dead=false;
    function open(){
      es=new EventSource(base+'/'+enc(path)+'.json'+(q||''));
      es.addEventListener('put',e=>{try{const m=JSON.parse(e.data);tree=m.path==='/'?(m.data===undefined?null:m.data):putAt(tree,m.path,m.data);cb(tree);}catch(x){}});
      es.addEventListener('patch',e=>{try{const m=JSON.parse(e.data);tree=patchAt(tree,m.path==='/'?'':m.path,m.data);cb(tree);}catch(x){}});
      es.addEventListener('cancel',()=>{if(onErr)onErr(new Error('cancel'));});
      es.onerror=()=>{if(es.readyState===2&&!dead&&onErr)onErr(new Error('closed'));};
    }
    open();
    return()=>{dead=true;if(es)es.close();};
  }
  const ARR=['dice','all','hl'];
  function fixDoc(d){
    if(!d||typeof d!=='object')return d;
    d=clone(d);
    for(const k of ARR){const v=d[k];if(v&&!Array.isArray(v)&&typeof v==='object')d[k]=Object.keys(v).sort((a,b)=>a-b).map(i=>v[i]);if(d[k]===undefined||d[k]===null)d[k]=[];}
    return d;
  }
  function snapDoc(path,v){return {id:path.split('/').pop(),exists:v!==null&&v!==undefined,data:()=>fixDoc(v)};}
  function mkDoc(path){
    return{
      id:path.split('/').pop(),path,
      async get(){return snapDoc(path,await req('GET',path));},
      async set(x){await req('PUT',path,x);},
      async update(x){await req('PATCH',path,flat(x,'',{}));},
      onSnapshot(cb,err){return stream(path,'',t=>cb(snapDoc(path,t)),err);},
      collection(name){return mkCol(path+'/'+name);}
    };
  }
  function mkCol(path){
    const q={};
    const c={
      async add(x){const r=await req('POST',path,x);return mkDoc(path+'/'+r.name);},
      orderBy(){return c;},
      limit(n){q.n=n;return c;},
      onSnapshot(cb,err){
        const qs='?orderBy='+encodeURIComponent('"$key"')+'&limitToLast='+(q.n||50);
        return stream(path,qs,t=>{
          const docs=Object.keys(t||{}).sort().map(id=>({id,data:()=>clone(t[id])}));
          cb({docs});
        },err);
      }
    };
    return c;
  }
  return{doc:mkDoc,collection:mkCol};
}
